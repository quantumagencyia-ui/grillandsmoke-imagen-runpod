name: imagen-runpod

# Construye la imagen amd64 del worker de RunPod y la sube a GHCR.
# La imagen solo lleva código y nodos; los modelos van en el network volume.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - verificar-imagen.sh
      - .github/workflows/imagen.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: imagen-runpod
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      # La base con CUDA + torch pesa ~10 GB descomprimida; el runner trae ~14 GB
      # libres y el build necesita las dos copias de capas a la vez.
      - name: Liberar disco del runner
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige minúsculas; metadata-action las pone.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Qué se publicó
        run: |
          echo "### Imagen publicada" >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "En RunPod, fijar el endpoint al tag sha-…, no a latest." >> "$GITHUB_STEP_SUMMARY"
